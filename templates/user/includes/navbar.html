<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- User CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user.css', v=2) }}">
</head>

<body>
    <nav class="main-navbar">

        <div class="nav-wrapper">

            <!-- LEFT : LOGO -->
            <div class="nav-left">
                <a href="/dashboard" class="logo">
                    🛍️ <span class="logo-text">SmartCart</span>
                </a>
            </div>


            <!-- CENTER : CATEGORY + SEARCH -->
            <div class="nav-center">

                <form action="/dashboard" method="GET" class="search-form">

                    <!-- CATEGORY FROM DB -->
                    <select name="category" class="category-select">
                        <option value="">All</option>
                        {% for c in categories %}
                        <option value="{{ c.category }}" {% if selected_category==c.category %}selected{% endif %}>
                            {{ c.category }}
                        </option>
                        {% endfor %}
                    </select>

                    <!-- SEARCH -->
                    <input type="text" name="search" class="search-input" placeholder="Search for products..."
                        value="{{ search }}">

                    <!-- BUTTON -->
                    <button type="submit" class="search-btn">🔍</button>

                </form>

            </div>


            <!-- RIGHT : CART + PROFILE -->
            <div class="nav-right">

                <!-- CART -->
                <a href="/cart" class="cart-btn position-relative">
                    🛒
                    <span class="cart-badge">{{ cart_count }}</span>
                </a>

                <!-- PROFILE -->
                <div class="dropdown">
                    <button class="profile-btn dropdown-toggle" data-bs-toggle="dropdown">
                        {{ session.get('user_name','U')[0] | upper }}
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end shadow">

                        <li class="px-3 py-2 text-muted small">
                            Signed in as <br>
                            <strong>{{ session.get('user_name','User') }}</strong>
                        </li>

                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item" href="/profile">My Profile</a></li>
                        <li><a class="dropdown-item" href="/cart">My Cart</a></li>
                        <li><a class="dropdown-item" href="/my-orders">My Orders</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item text-danger" href="/logout-user">Logout</a></li>

                    </ul>
                </div>

            </div>

        </div>

    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
